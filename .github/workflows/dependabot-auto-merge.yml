name: Dependabot Auto-Merge

# Trigger when external CI (Prow) reports status updates
on:
  check_suite:
    types: [completed]
  status: {}
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test auto-merge logic on'
        required: true
        type: number
      dry_run:
        description: 'Dry run mode - log actions without actually merging'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  statuses: read
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Debug - Event Information
        run: |
          echo "========================================"
          echo "🔍 DEBUG: Event Information"
          echo "========================================"
          echo "Event name: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo ""
          echo "Event payload summary:"
          if [[ "${{ github.event_name }}" == "check_suite" ]]; then
            echo "  - Check suite action: ${{ github.event.action }}"
            echo "  - Check suite conclusion: ${{ github.event.check_suite.conclusion }}"
            echo "  - Check suite head SHA: ${{ github.event.check_suite.head_sha }}"
            echo "  - Check suite app: ${{ github.event.check_suite.app.name }}"
          elif [[ "${{ github.event_name }}" == "status" ]]; then
            echo "  - Status state: ${{ github.event.state }}"
            echo "  - Status context: ${{ github.event.context }}"
            echo "  - Commit SHA: ${{ github.event.commit.sha }}"
            echo "  - Target URL: ${{ github.event.target_url }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "  - Manual trigger"
            echo "  - PR number input: ${{ inputs.pr_number }}"
            echo "  - Dry run input: ${{ inputs.dry_run }}"
          fi
          echo "========================================"

      - name: Find Dependabot PR for this commit
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "========================================"
          echo "🔍 DEBUG: Finding PR for this commit"
          echo "========================================"
          
          # For manual dispatch, use provided PR number
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "📋 Manual dispatch detected"
            echo "  - Using provided PR number: ${{ inputs.pr_number }}"
            echo "  - Dry run mode: ${{ inputs.dry_run }}"
            echo ""
            echo "pr_number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ Using manual PR number"
            exit 0
          fi
          
          # Get the commit SHA that triggered this event
          if [[ "${{ github.event_name }}" == "check_suite" ]]; then
            SHA="${{ github.event.check_suite.head_sha }}"
            echo "📋 Check suite event - using head_sha"
          else
            SHA="${{ github.event.commit.sha }}"
            echo "📋 Status event - using commit.sha"
          fi
          
          echo "  - Commit SHA: $SHA"
          echo ""
          
          if [[ -z "$SHA" ]] || [[ "$SHA" == "null" ]]; then
            echo "❌ ERROR: Could not determine commit SHA from event"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Find the PR associated with this commit
          echo "🔍 Searching for PR with this commit..."
          PR_RESPONSE=$(gh api "/repos/${{ github.repository }}/commits/${SHA}/pulls" 2>&1) || {
            echo "❌ ERROR: Failed to query GitHub API"
            echo "  - Response: $PR_RESPONSE"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          }
          
          echo "  - API response received"
          PR_COUNT=$(echo "$PR_RESPONSE" | jq 'length')
          echo "  - PRs found: $PR_COUNT"
          
          if [[ "$PR_COUNT" == "0" ]]; then
            echo "ℹ️  No PR found for this commit - this may be a direct push"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          PR_DATA=$(echo "$PR_RESPONSE" | jq '.[0]')
          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number')
          PR_AUTHOR=$(echo "$PR_DATA" | jq -r '.user.login')
          PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
          PR_STATE=$(echo "$PR_DATA" | jq -r '.state')
          
          echo ""
          echo "📋 PR Details:"
          echo "  - PR Number: #$PR_NUMBER"
          echo "  - Author: $PR_AUTHOR"
          echo "  - Title: $PR_TITLE"
          echo "  - State: $PR_STATE"
          echo ""
          
          # Only process Dependabot PRs
          if [[ "$PR_AUTHOR" != "dependabot[bot]" ]]; then
            echo "ℹ️  PR author is not dependabot[bot], skipping"
            echo "  - Expected: dependabot[bot]"
            echo "  - Got: $PR_AUTHOR"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "✅ This is a Dependabot PR - will process"
          echo ""
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "dry_run=false" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "========================================"

      - name: Check if PR should be processed
        if: steps.find-pr.outputs.skip == 'true'
        run: |
          echo "========================================"
          echo "⏭️  SKIPPING: Not a Dependabot PR or no PR found"
          echo "========================================"
          echo "This workflow only processes Dependabot PRs."
          echo "Exiting gracefully."

      - name: Get PR Details
        if: steps.find-pr.outputs.skip != 'true'
        id: pr-details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "========================================"
          echo "🔍 DEBUG: Getting PR Details"
          echo "========================================"
          
          PR_NUMBER="${{ steps.find-pr.outputs.pr_number }}"
          echo "📋 Fetching details for PR #$PR_NUMBER"
          echo ""
          
          # Get PR info
          PR_DATA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels,title,state,mergeable,mergeStateStatus,headRefOid,baseRefName,author)
          
          echo "📋 Raw PR data:"
          echo "$PR_DATA" | jq '.'
          echo ""
          
          # Extract fields
          TITLE=$(echo "$PR_DATA" | jq -r '.title')
          STATE=$(echo "$PR_DATA" | jq -r '.state')
          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
          MERGE_STATE=$(echo "$PR_DATA" | jq -r '.mergeStateStatus')
          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.headRefOid')
          BASE_BRANCH=$(echo "$PR_DATA" | jq -r '.baseRefName')
          AUTHOR=$(echo "$PR_DATA" | jq -r '.author.login')
          
          echo "📋 Parsed PR Details:"
          echo "  - Title: $TITLE"
          echo "  - State: $STATE"
          echo "  - Mergeable: $MERGEABLE"
          echo "  - Merge State: $MERGE_STATE"
          echo "  - Head SHA: $HEAD_SHA"
          echo "  - Base Branch: $BASE_BRANCH"
          echo "  - Author: $AUTHOR"
          echo ""
          
          # Check labels
          echo "🏷️  Checking labels..."
          LABELS=$(echo "$PR_DATA" | jq -r '.labels[].name' 2>/dev/null || echo "")
          echo "  - Labels found: $LABELS"
          
          HAS_DEPENDENCY=$(echo "$LABELS" | grep -c "area/dependency" || true)
          HAS_OK_TO_TEST=$(echo "$LABELS" | grep -c "ok-to-test" || true)
          
          echo "  - Has 'area/dependency': $([[ $HAS_DEPENDENCY -gt 0 ]] && echo 'YES ✅' || echo 'NO ❌')"
          echo "  - Has 'ok-to-test': $([[ $HAS_OK_TO_TEST -gt 0 ]] && echo 'YES ✅' || echo 'NO ❌')"
          
          if [[ "$HAS_DEPENDENCY" -gt 0 ]] && [[ "$HAS_OK_TO_TEST" -gt 0 ]]; then
            echo "  ✅ All required labels present"
            echo "has-required-labels=true" >> $GITHUB_OUTPUT
          else
            echo "  ❌ Missing required labels"
            echo "has-required-labels=false" >> $GITHUB_OUTPUT
          fi
          echo ""
          
          # Save state info
          echo "state=$STATE" >> $GITHUB_OUTPUT
          echo "mergeable=$MERGEABLE" >> $GITHUB_OUTPUT
          echo "merge-state=$MERGE_STATE" >> $GITHUB_OUTPUT
          echo "head-sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          
          # Determine update type from title
          echo "📊 Analyzing version update type..."
          echo "  - Title: $TITLE"
          
          # Check for major version bump indicators
          if echo "$TITLE" | grep -qiE "bump.*from [0-9]+\.[0-9]+\.[0-9]+ to [0-9]+\."; then
            # Extract versions
            OLD_VERSION=$(echo "$TITLE" | grep -oE "from [0-9]+\.[0-9]+\.[0-9]+" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
            NEW_VERSION=$(echo "$TITLE" | grep -oE "to [0-9]+\.[0-9]+\.[0-9]+" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
            
            OLD_MAJOR=$(echo "$OLD_VERSION" | cut -d. -f1)
            NEW_MAJOR=$(echo "$NEW_VERSION" | cut -d. -f1)
            OLD_MINOR=$(echo "$OLD_VERSION" | cut -d. -f2)
            NEW_MINOR=$(echo "$NEW_VERSION" | cut -d. -f2)
            
            echo "  - Old version: $OLD_VERSION (major: $OLD_MAJOR, minor: $OLD_MINOR)"
            echo "  - New version: $NEW_VERSION (major: $NEW_MAJOR, minor: $NEW_MINOR)"
            
            if [[ -n "$OLD_MAJOR" ]] && [[ -n "$NEW_MAJOR" ]] && [[ "$OLD_MAJOR" != "$NEW_MAJOR" ]]; then
              echo "  🚨 MAJOR version update detected!"
              echo "update-type=major" >> $GITHUB_OUTPUT
            elif [[ -n "$OLD_MINOR" ]] && [[ -n "$NEW_MINOR" ]] && [[ "$OLD_MINOR" != "$NEW_MINOR" ]]; then
              echo "  📦 MINOR version update detected"
              echo "update-type=safe" >> $GITHUB_OUTPUT
            else
              echo "  🔧 PATCH version update detected"
              echo "update-type=safe" >> $GITHUB_OUTPUT
            fi
          else
            echo "  - Could not parse version from title, assuming safe update"
            echo "update-type=safe" >> $GITHUB_OUTPUT
          fi
          echo ""
          echo "========================================"

      - name: Check All CI Status
        if: steps.find-pr.outputs.skip != 'true'
        id: ci-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "========================================"
          echo "🔍 DEBUG: Checking CI Status"
          echo "========================================"
          
          HEAD_SHA="${{ steps.pr-details.outputs.head-sha }}"
          echo "📋 Checking status for commit: $HEAD_SHA"
          echo ""
          
          # Get combined status (includes Prow and other external CI)
          echo "🔄 Fetching combined status (external CI like Prow)..."
          STATUS_RESPONSE=$(gh api "/repos/${{ github.repository }}/commits/${HEAD_SHA}/status")
          
          COMBINED_STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.state')
          TOTAL_COUNT=$(echo "$STATUS_RESPONSE" | jq -r '.total_count')
          
          echo "  - Combined state: $COMBINED_STATUS"
          echo "  - Total status checks: $TOTAL_COUNT"
          echo ""
          
          # List individual statuses
          echo "📋 Individual status checks:"
          echo "$STATUS_RESPONSE" | jq -r '.statuses[] | "  - [\(.state)] \(.context): \(.description // "no description")"' 2>/dev/null || echo "  (no statuses found)"
          echo ""
          
          # Also check GitHub check runs
          echo "🔄 Fetching GitHub check runs..."
          CHECKS_RESPONSE=$(gh api "/repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs")
          
          TOTAL_CHECKS=$(echo "$CHECKS_RESPONSE" | jq -r '.total_count')
          echo "  - Total check runs: $TOTAL_CHECKS"
          echo ""
          
          echo "📋 Individual check runs:"
          echo "$CHECKS_RESPONSE" | jq -r '.check_runs[] | "  - [\(.conclusion // .status)] \(.name)"' 2>/dev/null || echo "  (no check runs found)"
          echo ""
          
          # Count failures
          PENDING_CHECKS=$(echo "$CHECKS_RESPONSE" | jq '[.check_runs[] | select(.conclusion == null and .status != "completed")] | length')
          FAILED_CHECKS=$(echo "$CHECKS_RESPONSE" | jq '[.check_runs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral" and .conclusion != null)] | length')
          
          echo "📊 Check run summary:"
          echo "  - Pending: $PENDING_CHECKS"
          echo "  - Failed: $FAILED_CHECKS"
          echo ""
          
          # Determine if all passed
          if [[ "$COMBINED_STATUS" == "success" ]] && [[ "$FAILED_CHECKS" == "0" ]] && [[ "$PENDING_CHECKS" == "0" ]]; then
            echo "✅ All CI checks passed!"
            echo "all-passed=true" >> $GITHUB_OUTPUT
          elif [[ "$COMBINED_STATUS" == "pending" ]] || [[ "$PENDING_CHECKS" -gt 0 ]]; then
            echo "⏳ CI checks still running..."
            echo "  - Combined status: $COMBINED_STATUS"
            echo "  - Pending checks: $PENDING_CHECKS"
            echo "all-passed=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Some CI checks failed"
            echo "  - Combined status: $COMBINED_STATUS"
            echo "  - Failed checks: $FAILED_CHECKS"
            echo "all-passed=false" >> $GITHUB_OUTPUT
          fi
          echo ""
          echo "========================================"

      - name: Merge Safe Dependabot PRs
        if: |
          steps.find-pr.outputs.skip != 'true' &&
          steps.pr-details.outputs.has-required-labels == 'true' &&
          steps.pr-details.outputs.update-type == 'safe' &&
          steps.ci-status.outputs.all-passed == 'true' &&
          steps.pr-details.outputs.state == 'OPEN'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "========================================"
          echo "🚀 MERGING: All conditions met!"
          echo "========================================"
          
          PR_NUMBER="${{ steps.find-pr.outputs.pr_number }}"
          
          echo "📋 Merge conditions:"
          echo "  ✅ PR is from Dependabot"
          echo "  ✅ Has required labels (area/dependency, ok-to-test)"
          echo "  ✅ Update type is safe (patch/minor)"
          echo "  ✅ All CI checks passed"
          echo "  ✅ PR state is OPEN"
          echo ""
          echo "📋 PR Details:"
          echo "  - PR Number: #$PR_NUMBER"
          echo "  - Title: ${{ steps.pr-details.outputs.title }}"
          echo ""
          
          if [[ "${{ steps.find-pr.outputs.dry_run }}" == "true" ]]; then
            echo "🧪 ========================================="
            echo "🧪 DRY RUN MODE - No actual merge will occur"
            echo "🧪 ========================================="
            echo ""
            echo "Would execute:"
            echo "  gh pr merge $PR_NUMBER --merge --repo ${{ github.repository }}"
            echo ""
            echo "🧪 Dry run complete - no changes made"
          else
            echo "🔄 Executing merge..."
            echo "  Command: gh pr merge $PR_NUMBER --merge --repo ${{ github.repository }}"
            echo ""
            
            MERGE_OUTPUT=$(gh pr merge "$PR_NUMBER" --merge --repo "${{ github.repository }}" 2>&1) && {
              echo "✅ SUCCESS: PR #$PR_NUMBER merged!"
              echo "  Output: $MERGE_OUTPUT"
            } || {
              echo "❌ FAILED: Could not merge PR #$PR_NUMBER"
              echo "  Error: $MERGE_OUTPUT"
              exit 1
            }
          fi
          echo "========================================"

      - name: Comment on Major Version Updates
        if: |
          steps.find-pr.outputs.skip != 'true' &&
          steps.pr-details.outputs.has-required-labels == 'true' &&
          steps.pr-details.outputs.update-type == 'major' &&
          steps.ci-status.outputs.all-passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "========================================"
          echo "🚨 MAJOR VERSION UPDATE DETECTED"
          echo "========================================"
          
          PR_NUMBER="${{ steps.find-pr.outputs.pr_number }}"
          
          echo "📋 This PR contains a major version update"
          echo "  - PR Number: #$PR_NUMBER"
          echo "  - Title: ${{ steps.pr-details.outputs.title }}"
          echo ""
          echo "⚠️  Major updates require manual review due to potential breaking changes"
          echo ""
          
          # Check if we've already commented
          echo "🔍 Checking for existing comment..."
          EXISTING_COMMENT=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json comments --jq '.comments[].body' | grep -c "Major Version Update Detected" || true)
          
          if [[ "$EXISTING_COMMENT" -gt 0 ]]; then
            echo "ℹ️  Already commented on this PR - skipping duplicate comment"
            exit 0
          fi
          
          if [[ "${{ steps.find-pr.outputs.dry_run }}" == "true" ]]; then
            echo "🧪 DRY RUN: Would add comment about major version update"
          else
            echo "💬 Adding comment to PR..."
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body \
              "🚨 **Major Version Update Detected** 🚨
              
              This PR contains a major version update that requires manual review.
              
              **Title:** ${{ steps.pr-details.outputs.title }}
              
              Please review the changelog and breaking changes before merging.
              
              Auto-merge has been **disabled** for this PR."
            echo "✅ Comment added successfully"
          fi
          echo "========================================"

      - name: Log Decision Summary
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║              AUTO-MERGE DECISION SUMMARY                       ║"
          echo "╠════════════════════════════════════════════════════════════════╣"
          echo "║ Event: ${{ github.event_name }}"
          echo "║ Repository: ${{ github.repository }}"
          echo "║ Workflow Run: ${{ github.run_id }}"
          echo "╠════════════════════════════════════════════════════════════════╣"
          
          if [[ "${{ steps.find-pr.outputs.skip }}" == "true" ]]; then
            echo "║ Status: SKIPPED (not a Dependabot PR)"
            echo "╚════════════════════════════════════════════════════════════════╝"
            exit 0
          fi
          
          echo "║ PR Number: #${{ steps.find-pr.outputs.pr_number }}"
          echo "║ Dry Run: ${{ steps.find-pr.outputs.dry_run }}"
          echo "╠════════════════════════════════════════════════════════════════╣"
          echo "║ CHECKS:"
          echo "║   Has Required Labels: ${{ steps.pr-details.outputs.has-required-labels }}"
          echo "║   Update Type: ${{ steps.pr-details.outputs.update-type }}"
          echo "║   All CI Passed: ${{ steps.ci-status.outputs.all-passed }}"
          echo "║   PR State: ${{ steps.pr-details.outputs.state }}"
          echo "║   Mergeable: ${{ steps.pr-details.outputs.mergeable }}"
          echo "╠════════════════════════════════════════════════════════════════╣"
          
          # Determine final decision
          if [[ "${{ steps.pr-details.outputs.has-required-labels }}" == "true" ]] && \
             [[ "${{ steps.pr-details.outputs.update-type }}" == "safe" ]] && \
             [[ "${{ steps.ci-status.outputs.all-passed }}" == "true" ]] && \
             [[ "${{ steps.pr-details.outputs.state }}" == "OPEN" ]]; then
            echo "║ DECISION: ✅ AUTO-MERGE EXECUTED"
          elif [[ "${{ steps.pr-details.outputs.update-type }}" == "major" ]]; then
            echo "║ DECISION: 🚨 REQUIRES MANUAL REVIEW (major update)"
          elif [[ "${{ steps.ci-status.outputs.all-passed }}" != "true" ]]; then
            echo "║ DECISION: ⏳ WAITING FOR CI"
          elif [[ "${{ steps.pr-details.outputs.has-required-labels }}" != "true" ]]; then
            echo "║ DECISION: ❌ MISSING REQUIRED LABELS"
          elif [[ "${{ steps.pr-details.outputs.state }}" != "OPEN" ]]; then
            echo "║ DECISION: ❌ PR NOT OPEN (state: ${{ steps.pr-details.outputs.state }})"
          else
            echo "║ DECISION: ❌ DOES NOT MEET CRITERIA"
          fi
          
          echo "╚════════════════════════════════════════════════════════════════╝"
